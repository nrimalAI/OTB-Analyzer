# Runs the ChessVision package's tests, including the end-to-end fixtures
# against the models in Models/, on a GitHub-hosted Mac. The repo is public,
# so this costs nothing. It is the check a pull request must pass before it
# is merged (CLAUDE.md). The same tests run on the Mac mini without Xcode
# through ./Scripts/swift-test.sh.
name: swift test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swift-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chessvision:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        # bash with pipefail, so that a failing `swift test | tee` fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Models are in the checkout
        # Without them the end-to-end tests are skipped and the run is green
        # without having read a single photo.
        run: test -d Models/BoardCorners.mlpackage && test -d Models/Pieces.mlpackage
      - name: swift test (Packages/ChessVision)
        run: ./Scripts/swift-test.sh 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      - name: Fixture scores
        if: always()
        run: grep -E "^fixture|^portrait|^grid|✘|➜|Test run|error:" "$RUNNER_TEMP/swift-test.log" || true
      - name: The end-to-end tests ran
        run: grep -q "^fixture aggregate" "$RUNNER_TEMP/swift-test.log" && grep -q "^portrait aggregate" "$RUNNER_TEMP/swift-test.log"
