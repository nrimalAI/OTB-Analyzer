name: ChessAnalyzer
options:
  bundleIdPrefix: com.nrimal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ChessVision:
    path: Packages/ChessVision
  ChessAnalysis:
    path: Packages/ChessAnalysis
  ChessBoardUI:
    path: Packages/ChessBoardUI
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    exactVersion: 0.9.0

targets:
  ChessAnalyzer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
      - path: Models
        buildPhase: sources  # .mlpackage → compiled .mlmodelc in the bundle
    dependencies:
      - package: ChessVision
      - package: ChessAnalysis
      - package: ChessBoardUI
      - package: ChessKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Chess Scanner"
        NSCameraUsageDescription: "Take a photo of a chess board to analyze the position."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # No network use at all; declaring exempt avoids the export-compliance
        # question on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6F2F8RV4WM
