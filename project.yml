name: ChessAnalyzer
options:
  bundleIdPrefix: com.nrimal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ChessVision:
    path: Packages/ChessVision
  ChessAnalysis:
    path: Packages/ChessAnalysis
  ChessBoardUI:
    path: Packages/ChessBoardUI
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    exactVersion: 0.9.0

targets:
  ChessAnalyzer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
      - path: Models
        buildPhase: sources  # .mlpackage → compiled .mlmodelc in the bundle
    dependencies:
      - package: ChessVision
      - package: ChessAnalysis
      - package: ChessBoardUI
      - package: ChessKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a chess board to analyze the position."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "OTB Analyzer"
        CODE_SIGN_STYLE: Automatic
